name: Android CI
on:
  push:
    branches: [ main, content-filter-engine, transport-core-v2 ]
  pull_request:
    branches: [ main ]
jobs:
  go-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.26'
    - run: cd mitm && go mod tidy && go build ./... && go run ./selfcheck
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.26'
    - name: Install NDK
      run: |
        echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "ndk;26.1.10909125" || echo "y" | sdkmanager "ndk;26.1.10909125"
    - name: gomobile bind
      run: |
        export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125
        go install golang.org/x/mobile/cmd/gomobile@latest
        gomobile init
        cd mitm && go mod tidy && go get golang.org/x/mobile && gomobile bind -target android -androidapi 26 -o mitm.aar .
    - uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.7.1'
    - name: Build official hev-socks5-tunnel JNI libs (tag 2.17.1)
      run: |
        set -e
        git clone --depth 1 --branch 2.17.1 --recurse-submodules https://github.com/heiher/hev-socks5-tunnel.git /tmp/hev
        cd /tmp/hev
        ln -sf . jni
        wget -q https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
        unzip -q android-ndk-r27d-linux.zip
        ./android-ndk-r27d/ndk-build clean
        ./android-ndk-r27d/ndk-build APP_MODULES=hev-socks5-tunnel -j$(nproc)
        for abi in armeabi-v7a arm64-v8a x86 x86_64; do
          mkdir -p $GITHUB_WORKSPACE/app/src/main/jniLibs/$abi
          cp libs/$abi/libhev-socks5-tunnel.so $GITHUB_WORKSPACE/app/src/main/jniLibs/$abi/
        done
        ls -la $GITHUB_WORKSPACE/app/src/main/jniLibs/*/
    - name: Put AAR into app and build APK
      run: |
        mkdir -p app/libs
        cp mitm/mitm.aar app/libs/mitm.aar
        gradle assembleRelease
    - uses: actions/upload-artifact@v4
      with:
        name: adblock-release-apk
        path: app/build/outputs/apk/release/app-release.apk
    - uses: actions/upload-artifact@v4
      with:
        name: mitm-aar
        path: mitm/mitm.aar
