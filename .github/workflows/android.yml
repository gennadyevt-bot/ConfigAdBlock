name: Android CI
on:
  push:
    branches: [ main, content-filter-engine ]
  pull_request:
    branches: [ main ]
jobs:
  go-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.26'
    - run: cd mitm && go mod tidy && go build ./...
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: '1.26'
    - name: Install NDK
      run: |
        echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "ndk;26.1.10909125" || echo "y" | sdkmanager "ndk;26.1.10909125"
    - name: gomobile bind
      run: |
        export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125
        go install golang.org/x/mobile/cmd/gomobile@latest
        gomobile init
        cd mitm && go mod tidy && go get golang.org/x/mobile && gomobile bind -target android -androidapi 26 -o mitm.aar .
    - uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.7.1'
    - name: Put AAR into app and build APK
      run: |
        mkdir -p app/libs
        cp mitm/mitm.aar app/libs/mitm.aar
        gradle assembleRelease
    - uses: actions/upload-artifact@v4
      with:
        name: adblock-release-apk
        path: app/build/outputs/apk/release/app-release.apk
    - uses: actions/upload-artifact@v4
      with:
        name: mitm-aar
        path: mitm/mitm.aar
