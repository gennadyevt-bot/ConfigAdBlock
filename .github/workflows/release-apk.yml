name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        default: "v2.0.39-transport"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: transport-core-v2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Install NDK
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "ndk;26.1.10909125" || echo "y" | sdkmanager "ndk;26.1.10909125"
      - name: gomobile bind
        run: |
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          cd mitm && go mod tidy && go get golang.org/x/mobile && gomobile bind -target android -androidapi 26 -o mitm.aar .
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.7.1'
      - name: Build hev-socks5-tunnel JNI
        run: |
          set -e
          git clone --depth 1 --branch 2.17.1 --recurse-submodules https://github.com/heiher/hev-socks5-tunnel.git /tmp/hev
          cd /tmp/hev
          ln -sf . jni
          wget -q https://dl.google.com/android/repository/android-ndk-r27d-linux.zip
          unzip -q android-ndk-r27d-linux.zip
          ./android-ndk-r27d/ndk-build clean
          ./android-ndk-r27d/ndk-build APP_MODULES=hev-socks5-tunnel -j$(nproc)
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            mkdir -p $GITHUB_WORKSPACE/app/src/main/jniLibs/$abi
            cp libs/$abi/libhev-socks5-tunnel.so $GITHUB_WORKSPACE/app/src/main/jniLibs/$abi/
          done
      - name: Build APK and create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/libs
          cp mitm/mitm.aar app/libs/mitm.aar
          gradle assembleRelease
          TAG="${{ github.event.inputs.tag }}"
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          gh release create "$TAG" "$APK"             --title "$TAG"             --notes "Сборка ветки transport-core-v2. Иконка: белый щит уменьшен на 18%."             --repo gennadyevt-bot/ConfigAdBlock             || gh release upload "$TAG" "$APK" --repo gennadyevt-bot/ConfigAdBlock --clobber
